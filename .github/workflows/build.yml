name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Checkout syms
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@master
        with:
          path: symbols
          ref: symbols

      - name: Checkout agbcc
        uses: actions/checkout@master
        with:
          path: agbcc
          repository: pret/agbcc

      - name: Install binutils
        run: |
          sudo apt install gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev
        # build-essential and git are already installed
        # gcc-arm-none-eabi is only needed for the modern build
        # as an alternative to dkP

      - name: Install agbcc
        run: |
          ./build.sh
          ./install.sh ../
        working-directory: agbcc

      - name: Compare
        run: make -j${nproc} all syms

      - name: Modern
        env:
          MODERN: 1
          COMPARE: 0
        run: make -j${nproc} all

      - name: Move symfiles
        if: ${{ github.event_name == 'push' }}
        run: |
          cp -v *.sym symbols/
          echo "SYMBOLS_COMMIT_MSG=$( git log --format=%s ${GITHUB_SHA} )" >> $GITHUB_ENV

      - name: Update symfiles
        if: ${{ github.event_name == 'push' }}
        uses: EndBug/add-and-commit@v7
        with:
          branch: symbols
          cwd: "./symbols"
          add: "*.sym"
          message: ${{ env.SYMBOLS_COMMIT_MSG }}

  desktop:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        diorama: [0, 1]
    name: Desktop i386 (DIORAMA=${{ matrix.diorama }})
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Install 32-bit desktop dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libc6-dev-i386 libpng-dev pkg-config \
            libsdl2-dev:i386 libsdl2-image-dev:i386 libgl-dev:i386 \
            libgl1-mesa-dri:i386 xvfb

      - name: Build SDL desktop executable
        run: make -f Makefile_pc NATIVE_LINUX=1 DIORAMA=${{ matrix.diorama }} -j$(nproc)

      - name: Verify 32-bit executable
        run: file pokeemerald | tee /dev/stderr | grep -q "ELF 32-bit"

      - name: Test diorama CPU modules
        if: matrix.diorama == 1
        run: make -f Makefile_pc test-diorama

      - name: Smoke test desktop presentation
        run: LIBGL_ALWAYS_SOFTWARE=1 timeout 5s xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX" ./pokeemerald || test $? -eq 124
